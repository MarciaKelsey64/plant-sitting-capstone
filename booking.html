<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure Checkout</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header
      style="
        padding: 1rem;
        border-bottom: 1px solid #eaeaea;
        display: flex;
        justify-content: space-between;
        align-items: center;
      "
    >
      <a
        href="#"
        id="backToProfileBtn"
        style="
          color: #1a7f37;
          text-decoration: none;
          font-weight: bold;
          font-size: 1.1rem;
        "
      >
        &larr; Back to Profile
      </a>
      <span style="color: #666; font-size: 0.9rem">🔒 Secure Booking</span>
    </header>

    <main style="max-width: 800px; margin: 3rem auto; padding: 0 1rem">
      <div id="checkoutContainer" style="text-align: center; padding: 3rem">
        <h2>Initializing secure checkout...</h2>
        <p>Preparing your booking details.</p>
      </div>
    </main>

    <script type="module" src="booking.js"></script>
  </body>
</html>
